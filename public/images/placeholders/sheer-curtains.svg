      <path d="M1206 68 L1206 812" stroke="#FFFDF8" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    
      <path d="M1236 74 Q1264 62 1292 74 L1296 805 Q1264 820 1232 805 Z" fill="url(#sheerFlow)"/>
      <path d="M1264 68 L1264 812" stroke="#FFFDF8" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    
      <path d="M1294 74 Q1322 62 1350 74 L1354 805 Q1322 820 1290 805 Z" fill="url(#sheerFlow)"/>
      <path d="M1322 68 L1322 812" stroke="#FFFDF8" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    
      <path d="M1352 74 Q1380 62 1408 74 L1412 805 Q1380 820 1348 805 Z" fill="url(#sheerFlow)"/>
      <path d="M1380 68 L1380 812" stroke="#FFFDF8" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    
      <path d="M1410 74 Q1438 62 1466 74 L1470 805 Q1438 820 1406 805 Z" fill="url(#sheerFlow)"/>
      <path d="M1438 68 L1438 812" stroke="#FFFDF8" stroke-width="2" stroke-opacity="0.45" fill="none"/>
    

    <!-- Diffused Morning Sunlight -->
    <polygon points="540,74 1480,74 1580,1080 320,1080" fill="url(#sunbeam)"/>
    
    <!-- Minimalist Sculptural Chair -->
    <g filter="url(#gentleShadow)">
      <ellipse cx="280" cy="850" rx="120" ry="40" fill="#D3C9B8"/>
      <path d="M200 780 Q280 730 360 780 L340 850 Q280 840 220 850 Z" fill="#E8E2D5"/>
    </g>
    <rect width="1600" height="1100" fill="url(#microGrain)"/>
  </svg>